services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiclin
      POSTGRES_PASSWORD: multiclin
      POSTGRES_DB: multiclin
    ports:
      # host 5435 (não 5432): sua máquina já tem um Postgres do sistema nessa porta.
      - "5435:5432"
    volumes:
      - multiclin_db_data:/var/lib/postgresql/data

volumes:
  multiclin_db_data:
